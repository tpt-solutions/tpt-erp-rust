<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TPT ERP — MES operator</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
      main { max-width: 980px; margin: 0 auto; padding: 1.5rem; }
      h1 { font-size: 1.4rem; }
      h2 { font-size: 1.1rem; border-bottom: 1px solid #334155; padding-bottom: .3rem; }
      section { margin-bottom: 2rem; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #1e293b; }
      button { background: #2563eb; color: white; border: 0; border-radius: 6px; padding: .35rem .6rem; cursor: pointer; }
      button:disabled { background: #475569; cursor: not-allowed; }
      .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
      .muted { color: #94a3b8; font-size: .85rem; }
      .pill { background: #1e293b; border-radius: 999px; padding: .15rem .6rem; font-size: .8rem; }
      .warn { color: #fbbf24; }
      .good { color: #4ade80; }
      input { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px; padding: .3rem .5rem; width: 7rem; }
      .bar { background: #1e293b; border-radius: 999px; height: .8rem; overflow: hidden; }
      .bar > span { display: block; height: 100%; background: #2563eb; }
    </style>
  </head>
  <body></body>
</html>
