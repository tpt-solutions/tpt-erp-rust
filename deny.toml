# cargo-deny policy: license allow-list.
#
# Policy: Apache-only dependencies are NOT allowed. A crate is accepted when at
# least one of its licenses (in an OR expression) is on the allow-list below.
# Because Apache-2.0 is deliberately absent from `allow`, a dual "MIT OR
# Apache-2.0" crate passes via MIT, while an Apache-only crate (including
# "Apache-2.0 WITH LLVM-exception" and "Apache-2.0 AND ISC") fails.
#
# The [[licenses.exceptions]] entries below are KNOWN VIOLATIONS that are
# tracked for migration. Each one is an explicit, reviewable waiver. Remove
# the entry when the crate is replaced or upgraded to a non-Apache-only
# license. Do not add new entries without a recorded decision.

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "MIT-0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

