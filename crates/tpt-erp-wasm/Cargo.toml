[package]
name = "tpt-erp-wasm"
readme = "README.md"
keywords = ["erp", "webassembly", "wasm", "wasmtime", "plugins"]
categories = ["wasm", "plugin", "development-tools"]

description = "Safe WebAssembly plugin runtime for TPT ERP using wasmtime (WIT-based, computation-only, fuel/memory limited, hot-swappable)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
thiserror = { workspace = true }
wasmtime = { version = "30", default-features = false, features = [
    "runtime",
    "cranelift",
    "component-model",
    "gc-null",
    "wat",
] }
serde = { workspace = true }
serde_json = { workspace = true }
tpt-erp-ledger = { workspace = true }
tpt-erp-primitives = { workspace = true }
tpt-erp-tenant = { workspace = true }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
