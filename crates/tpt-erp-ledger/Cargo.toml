[package]
name = "tpt-erp-ledger"
readme = "README.md"
keywords = ["erp", "ledger", "accounting", "event-sourcing", "double-entry"]
categories = ["finance", "database", "data-structures"]

description = "Event-sourced double-entry ledger and CQRS projection engine for TPT ERP."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
tpt-erp-primitives = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["time"] }
tracing = { version = "0.1", optional = true }
tpt-erp-bus = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }

[features]
# Postgres-backed `EventStore` (mirrored, RLS-scoped per tenant).
postgres = ["dep:sqlx", "dep:tokio", "dep:tracing"]
# Outbox pattern: stage appended events in an outbox table and relay them to the
# event bus with durable at-least-once delivery (requires `tpt-erp-bus`).
outbox = ["dep:tpt-erp-bus", "dep:tokio", "dep:tracing", "dep:async-trait"]

[dev-dependencies]
rust_decimal = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures = "0.3"

[lints]
workspace = true
