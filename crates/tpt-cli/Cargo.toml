[package]
name = "tpt-cli"
description = "TPT ERP CLI: `tpt plugin` scaffolds, builds, validates, and runs WIT-based WebAssembly plugins."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "tpt"
path = "src/main.rs"

[dependencies]
tpt-wasm = { workspace = true }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
wit-component = "0.224"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
