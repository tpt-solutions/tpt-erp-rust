[package]
name = "tpt-erp-bus"
readme = "README.md"
keywords = ["erp", "event-bus", "messaging", "nats", "background-jobs"]
categories = ["asynchronous", "network-programming", "concurrency"]

description = "Event-processing and background-job bus for TPT ERP. Decision: NATS JetStream (Rust-native, durable, single-binary). In-memory reference implementation included."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
parking_lot = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures = "0.3"
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "macros"] }

# Optional NATS JetStream backend.
async-nats = { version = "0.50", optional = true }

[features]
# Enables the NATS JetStream-backed implementation.
nats = ["dep:async-nats"]

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
