[package]
name = "tpt-erp-bus"
readme = "README.md"
keywords = ["erp", "event-bus", "messaging", "postgres", "background-jobs"]
categories = ["asynchronous", "network-programming", "concurrency"]

description = "Event-processing and background-job bus for TPT ERP. Decision: PostgreSQL-backed durable bus (ordered, at-least-once, no third-party messaging dependency). In-memory reference implementation included."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
parking_lot = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures = "0.3"
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "macros", "time"] }

# Optional PostgreSQL backend (shares the ledger's database).
sqlx = { workspace = true, optional = true }

[features]
# Enables the PostgreSQL-backed implementation in `postgres_impl`.
postgres = ["dep:sqlx"]

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
