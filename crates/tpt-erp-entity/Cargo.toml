[package]
name = "tpt-erp-entity"
readme = "README.md"
keywords = ["erp", "orm", "sql", "repository", "validation"]
categories = ["database", "data-structures", "web-programming"]

description = "Runtime support for TPT ERP entities: table mapping, validation, audit, and repository traits backing the TptEntity/TptApi derives."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
parking_lot = { workspace = true }
tpt-erp-primitives = { workspace = true }
tpt-erp-macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
sqlx = { workspace = true, optional = true }

[features]
# Postgres-backed `Repository` serving the generated Axum router.
postgres = ["dep:sqlx"]

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
