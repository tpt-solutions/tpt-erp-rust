[package]
name = "tpt-erp-cache"
readme = "README.md"
keywords = ["erp", "cache", "redis", "session", "cqrs"]
categories = ["caching", "database", "web-programming"]

description = "Redis/Dragonfly-backed session management and CQRS read-model cache for TPT ERP, with an in-memory reference implementation."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
parking_lot = { workspace = true }
tpt-erp-tenant = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true }

# In-memory + Redis backends need an async runtime and a shared connection.
tokio = { workspace = true, features = ["sync"] }

# Optional Redis/Dragonfly backend.
redis = { version = "0.27", features = ["tokio-comp"], optional = true }

[features]
# Enables the Redis/Dragonfly-backed implementations.
redis = ["dep:redis"]

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
