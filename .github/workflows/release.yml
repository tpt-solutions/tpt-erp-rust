name: release

# Publishes each framework crate to crates.io when a `v*` tag is pushed.
# Requires a `CARGO_REGISTRY_TOKEN` secret (crates.io API token) in the repo settings.
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
  RUSTFLAGS: "-D warnings"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  # Gate publishing on a clean build/test run for the tagged commit. This lives in the
  # same workflow as `publish` so `needs:` can enforce it — a tag can't be published
  # without CI having passed on that exact commit.
  verify:
    name: verify (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

  # Generate a CycloneDX SBOM of the whole workspace (Rust crates + transitive
  # dependencies) for supply-chain attestation — required by many enterprise ERP
  # buyers during procurement. Uploaded as a build artifact on every release tag.
  sbom:
    name: generate SBOM
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: tpt-erp-rust.sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: tpt-erp-rust-sbom
          path: tpt-erp-rust.sbom.cdx.json

  publish:
    name: publish crates
    needs: [verify, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify
        run: cargo publish --dry-run --allow-dirty

      # Publish framework crates in dependency order. Inter-crate versions are kept in
      # lockstep at 0.1.0; `--allow-dirty` tolerates the workspace metadata.
      - name: Publish tpt-erp-primitives
        run: cargo publish -p tpt-erp-primitives --allow-dirty
      - name: Publish tpt-erp-macros
        run: cargo publish -p tpt-erp-macros --allow-dirty
      - name: Publish tpt-erp-entity
        run: cargo publish -p tpt-erp-entity --allow-dirty
      - name: Publish tpt-erp-ledger
        run: cargo publish -p tpt-erp-ledger --allow-dirty
      - name: Publish tpt-erp-tenant
        run: cargo publish -p tpt-erp-tenant --allow-dirty
      - name: Publish tpt-erp-wasm
        run: cargo publish -p tpt-erp-wasm --allow-dirty
      - name: Publish tpt-erp-bus
        run: cargo publish -p tpt-erp-bus --allow-dirty
      - name: Publish tpt-erp-cache
        run: cargo publish -p tpt-erp-cache --allow-dirty
      - name: Publish tpt-erp-observability
        run: cargo publish -p tpt-erp-observability --allow-dirty
      - name: Publish tpt-erp-cli
        run: cargo publish -p tpt-erp-cli --allow-dirty
      - name: Publish tpt-erp-frontend
        run: cargo publish -p tpt-erp-frontend --allow-dirty
