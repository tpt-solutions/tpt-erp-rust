# cargo-deny configuration for TPT ERP (a financial platform — supply-chain
# hygiene matters). Run locally with `cargo deny check`.

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Treat unknown licenses as a warning (not a hard failure) so a single uncommon
# but benign license doesn't break CI; the team can promote it to the allow list.
unlicensed = "deny"
allow-osi-fsf-free = "either"
copyleft = "warn"
default = "deny"
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
