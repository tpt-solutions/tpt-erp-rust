[workspace]
resolver = "3"
members = [
    "crates/tpt-erp-primitives",
    "crates/tpt-erp-macros",
    "crates/tpt-erp-ledger",
    "crates/tpt-erp-tenant",
    "crates/tpt-erp-wasm",
    "crates/tpt-erp-entity",
    "crates/tpt-erp-frontend",
    "crates/tpt-erp-cli",
    "crates/tpt-erp-cache",
    "crates/tpt-erp-bus",
    "crates/tpt-erp-observability",
    "examples/quickstart",
    "examples/server",
    "examples/wms",
    "examples/mes",
    "examples/gl",
    "examples/oms",
    "examples/oms-ui",
    "examples/wms-ui",
    "examples/mes-ui",
    "examples/gl-ui",
    "examples/pos",
    "examples/pos-ui",
    "examples/tms",
    "examples/tms-ui",
    "examples/flow",
]

exclude = [
    "examples/plugins/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-erp-rust/tpt-erp-rust"
homepage = "https://github.com/tpt-erp-rust/tpt-erp-rust"
authors = ["TPT Solutions"]
rust-version = "1.97"
keywords = ["erp", "finance", "ledger", "webassembly", "multitenancy"]
categories = ["database", "finance", "web-programming"]

[workspace.dependencies]
# Internal crates
tpt-erp-primitives = { path = "crates/tpt-erp-primitives", version = "0.1.0" }
tpt-erp-macros = { path = "crates/tpt-erp-macros", version = "0.1.0" }
tpt-erp-ledger = { path = "crates/tpt-erp-ledger", version = "0.1.0" }
tpt-erp-tenant = { path = "crates/tpt-erp-tenant", version = "0.1.0" }
tpt-erp-entity = { path = "crates/tpt-erp-entity", version = "0.1.0" }
tpt-erp-wasm = { path = "crates/tpt-erp-wasm", version = "0.1.0" }
tpt-erp-bus = { path = "crates/tpt-erp-bus", version = "0.1.0" }
tpt-erp-cache = { path = "crates/tpt-erp-cache", version = "0.1.0" }
tpt-erp-observability = { path = "crates/tpt-erp-observability", version = "0.1.0" }
gl = { path = "examples/gl", version = "0.1.0" }

# Common third-party deps
rust_decimal = { version = "1", features = ["serde", "maths"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = "0.5"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
async-trait = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "macros"] }
leptos = { version = "0.7", default-features = false }
rayon = "1"
rumqttc = { version = "0.24", features = ["use-rustls"] }
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }

[workspace.lints.rust]
unsafe_code = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
