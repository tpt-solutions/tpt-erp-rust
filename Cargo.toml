[workspace]
resolver = "3"
members = [
    "crates/tpt-primitives",
    "crates/tpt-macros",
    "crates/tpt-ledger",
    "crates/tpt-tenant",
    "crates/tpt-wasm",
    "crates/tpt-entity",
    "crates/tpt-frontend",
    "crates/tpt-cli",
    "crates/tpt-cache",
    "crates/tpt-bus",
    "examples/quickstart",
    "examples/server",
]

exclude = [
    "examples/plugins/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-erp-rust/tpt-erp-rust"
homepage = "https://github.com/tpt-erp-rust/tpt-erp-rust"
authors = ["TPT Solutions"]
rust-version = "1.85"
keywords = ["erp", "finance", "ledger", "webassembly", "multitenancy"]
categories = ["database", "finance", "web-programming"]

[workspace.dependencies]
# Internal crates
tpt-primitives = { path = "crates/tpt-primitives", version = "0.1.0" }
tpt-macros = { path = "crates/tpt-macros", version = "0.1.0" }
tpt-ledger = { path = "crates/tpt-ledger", version = "0.1.0" }
tpt-tenant = { path = "crates/tpt-tenant", version = "0.1.0" }
tpt-entity = { path = "crates/tpt-entity", version = "0.1.0" }
tpt-wasm = { path = "crates/tpt-wasm", version = "0.1.0" }

# Common third-party deps
rust_decimal = { version = "1", features = ["serde", "maths"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = "0.5"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
async-trait = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "macros"] }
leptos = { version = "0.7", default-features = false }

[workspace.lints.rust]
unsafe_code = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
