# Default values for the tpt-erp-ingestion chart.
#
# These nodes run the high-throughput ingestion workloads: WMS IoT (MQTT conveyor /
# RFID) and MES machine-telemetry (CNC/PLC) pipelines. They are intentionally
# horizontally scalable and isolated from the API tier.

replicaCount: 2

image:
  repository: ghcr.io/tpt-erp-rust/ingestion
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Back-pressure-aware resource sizing. Ingestion is CPU-bound (parse + transform)
# and bursts with device traffic, so we give generous CPU and cap memory.
resources:
  requests:
    cpu: "500m"
    memory: "256Mi"
  limits:
    cpu: "2"
    memory: "512Mi"

# Autoscaling: scale on CPU, but also expose the knobs to scale on custom
# metrics (e.g. MQTT message rate) once a metrics pipeline is wired in.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  # targetMetric is a placeholder for a custom Prometheus/KEDA metric, e.g.
  # messages-per-second per pod. Left commented until the metrics server is up.
  # targetMetric:
  #   type: Pods
  #   pods:
  #     metric:
  #       name: mqtt_messages_per_second
  #     target:
  #       type: AverageValue
  #       averageValue: "1000"

# Environment passed to every ingestion pod. Tenant isolation is enforced at the
# data layer (tpt-erp-tenant + Postgres RLS), so these nodes only carry connection
# wiring, never trust.
env:
  RUST_LOG: "info"
  TPT_BUS_URL: "nats://nats:4222"
  TPT_CACHE_URL: "redis://redis:6379"
  TPT_NATS_STREAM: "tpt-events"

service:
  name: ingestion
  port: 8080
  # Ingestion is pull-based from the bus; the service is only for health/readiness.
  type: ClusterIP

# Liveness/readiness so the HPA and rollouts react to stuck consumers.
health:
  livenessPath: /healthz
  readinessPath: /readyz

# ---------------------------------------------------------------------------
# Backing services (optional in-cluster deployments).
# ---------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

networkPolicy:
  enabled: true

postgres:
  enabled: true
  replicas: 1
  image: "postgres:16-alpine"
  database: tpt_erp
  username: tpt
  password: "change-me-in-prod"
  storage: "10Gi"
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

nats:
  enabled: true
  replicas: 1
  image: "nats:2.10"
  storage: "5Gi"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

redis:
  enabled: true
  replicas: 1
  image: "redis:7-alpine"
  storage: "5Gi"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ---------------------------------------------------------------------------
# Application servers (one Deployment + Service + HPA per entry).
# ---------------------------------------------------------------------------
servers:
  - name: wms
    enabled: true
    image:
      repository: ghcr.io/tpt-erp-rust/wms
      tag: "0.1.0"
      pullPolicy: IfNotPresent
    replicas: 2
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "512Mi"
    autoscaling:
      minReplicas: 2
      maxReplicas: 20
      targetCPUUtilizationPercentage: 70
  - name: mes
    enabled: true
    image:
      repository: ghcr.io/tpt-erp-rust/mes
      tag: "0.1.0"
      pullPolicy: IfNotPresent
    replicas: 2
    resources:
