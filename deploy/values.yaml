    autoscaling:
      minReplicas: 2
      maxReplicas: 20
      targetCPUUtilizationPercentage: 70
  - name: pos
    enabled: true
    image:
      repository: ghcr.io/tpt-erp-rust/pos
      tag: "0.1.0"
      pullPolicy: IfNotPresent
    replicas: 2
