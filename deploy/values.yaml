      pullPolicy: IfNotPresent
    replicas: 2
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "512Mi"
    autoscaling:
      minReplicas: 2
      maxReplicas: 20
      targetCPUUtilizationPercentage: 70
  - name: oms
    enabled: true
    image:
      repository: ghcr.io/tpt-erp-rust/oms
      tag: "0.1.0"
      pullPolicy: IfNotPresent
    replicas: 2
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "1"
