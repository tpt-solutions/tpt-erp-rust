{{- if .Values.postgres.enabled }}
{{- if eq .Values.postgres.password "change-me-in-prod" }}
{{- fail "postgres.password is still the insecure default 'change-me-in-prod'; override it (e.g. --set postgres.password=$(openssl rand -base64 24))" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}
  url: "postgres://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@{{ .Release.Name }}-postgres:5432/{{ .Values.postgres.database }}"
{{- end }}
