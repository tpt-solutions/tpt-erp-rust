{{- range .Values.servers }}
{{- if .enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  labels:
    app.kubernetes.io/name: tpt-erp-{{ .name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ .name }}
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: tpt-erp-{{ .name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tpt-erp-{{ .name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ .name }}
    spec:
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .name }}
          image: "{{ .image.repository }}:{{ .image.tag }}"
          imagePullPolicy: {{ .image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $.Values.service.port }}
          env:
            - name: RUST_LOG
              value: {{ $.Values.env.RUST_LOG | quote }}
            - name: TPT_BIND
              value: "0.0.0.0:{{ $.Values.service.port }}"
            - name: TPT_BUS_URL
              value: {{ $.Values.env.TPT_BUS_URL | quote }}
            - name: TPT_CACHE_URL
              value: {{ $.Values.env.TPT_CACHE_URL | quote }}
            - name: TPT_NATS_STREAM
              value: {{ $.Values.env.TPT_NATS_STREAM | quote }}
            - name: TPT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}-postgres
                  key: url
          resources:
            {{- toYaml .resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ $.Values.health.livenessPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: {{ $.Values.health.readinessPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  labels:
    app.kubernetes.io/name: tpt-erp-{{ .name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  type: {{ $.Values.service.type }}
  selector:
    app.kubernetes.io/name: tpt-erp-{{ .name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    - name: http
      port: {{ $.Values.service.port }}
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  labels:
    app.kubernetes.io/name: tpt-erp-{{ .name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $.Release.Name }}-{{ .name }}
  minReplicas: {{ .autoscaling.minReplicas }}
  maxReplicas: {{ .autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
